<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="Monster Legends Arena - The ultimate monster-catching MMORPG" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Monster Legends Arena</title>
  <link rel="icon" type="image/png" href="/assets/ui/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/ui/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    #game-container {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #loading-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-logo { font-size: clamp(24px, 5vw, 48px); font-weight: 900; color: #fff; text-shadow: 0 0 30px #ff6b35, 0 0 60px #ff6b35; letter-spacing: 2px; margin-bottom: 16px; }
    .loading-sub { color: #aaa; font-size: 14px; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }
    .loading-bar-bg { width: min(400px, 80vw); height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffb347); border-radius: 3px; transition: width 0.3s ease; }
    .loading-text { color: #666; font-size: 12px; margin-top: 12px; letter-spacing: 2px; }
    #canvas-wrapper canvas { display: block !important; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">⚡ Monster Legends Arena</div>
    <div class="loading-sub">Loading world...</div>
    <div class="loading-bar-bg"><div class="loading-bar" id="loading-bar"></div></div>
    <div class="loading-text" id="loading-text">Initializing...</div>
  </div>
  <div id="game-container">
    <div id="canvas-wrapper"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
